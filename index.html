<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>トータル</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:#1f2328;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.8;min-height:100vh;display:flex;flex-direction:column}
a{color:#1a3f8a;text-decoration:none}a:hover{text-decoration:underline}
.top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 80px}
.logo{font-size:56px;letter-spacing:.22em;font-weight:600;margin:0 0 6px;color:#1f2328}
.logo b{color:#c8432b;font-weight:600}
.tag{font-size:13px;letter-spacing:.3em;color:#6b7078;margin:0 0 34px}
form.q{width:100%;max-width:620px;display:flex;border:1px solid #c9ccd1;border-radius:28px;padding:4px 6px 4px 22px;box-shadow:0 1px 6px rgba(0,0,0,.06);background:#fff}
form.q:focus-within{box-shadow:0 2px 10px rgba(0,0,0,.14);border-color:#b5b9bf}
form.q input{flex:1;border:0;outline:0;font:inherit;font-size:17px;padding:8px 0;background:transparent;min-width:0}
form.q button{border:0;background:#1f2328;color:#fff;font:inherit;font-size:14px;letter-spacing:.2em;padding:0 20px 0 22px;border-radius:22px;cursor:pointer}
.hint{margin:20px 0 0;font-size:13.5px;color:#6b7078}
.hint a{margin:0 8px;color:#4b5058}
.bar{display:none;border-bottom:1px solid #e3e5e8;background:#fff}
.bar .wrap{display:flex;align-items:center;gap:22px;max-width:980px;margin:0 auto;padding:14px 20px}
.bar .logo{font-size:24px;letter-spacing:.2em;margin:0;white-space:nowrap}
.bar form.q{max-width:600px;padding:2px 4px 2px 18px;box-shadow:none}
.bar form.q input{font-size:16px;padding:6px 0}
.bar form.q button{padding:0 16px;font-size:13px}
.res{display:none;max-width:980px;margin:0 auto;padding:18px 20px 70px;width:100%;flex:1}
.stat{font-size:13px;color:#6b7078;margin:0 0 18px}
.hit{max-width:640px;margin:0 0 26px}
.hit .src{font-size:13px;color:#4b5058;margin:0 0 1px}
.hit .src span{color:#6b7078}
.hit .src span:before{content:"　›　"}
.hit h3{font-size:19px;font-weight:500;line-height:1.5;margin:0 0 3px;font-family:"Hiragino Mincho ProN","Yu Mincho","Hiragino Mincho Pro","MS PMincho",serif}
.hit p{font-size:14px;color:#3b4048;margin:0;line-height:1.7}
.hit mark{background:transparent;color:#1f2328;font-weight:600}
.none{color:#4b5058;font-size:15px;max-width:640px}
.none p{margin:0 0 .6em}
footer{border-top:1px solid #e3e5e8;font-size:12.5px;color:#6b7078}
footer .wrap{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:0 auto;padding:14px 20px 26px}
footer a.mark{color:#6b7078;opacity:.55;font-size:12px;padding:6px 8px}
footer a.mark:hover{opacity:1;text-decoration:none}
body.has-q .top{display:none}
body.has-q .bar,body.has-q .res{display:block}
@media (max-width:560px){.logo{font-size:42px}.bar .wrap{flex-wrap:wrap;gap:10px}.bar .logo{font-size:20px}}
</style></head>
<body>
<div class="top"><p class="logo">トータ<b>ル</b></p><p class="tag">資料検索</p><form class="q" action="index.html" method="get"><input type="search" name="q" autocomplete="off" aria-label="検索語"><button type="submit">検索</button></form><p class="hint"><a href="annai.html">資料の案内</a><a href="index.html?q=統計院">統計院</a><a href="index.html?q=日々新報">日々新報</a></p></div>
<div class="bar"><div class="wrap"><a class="logo" href="index.html">トータ<b>ル</b></a><form class="q" action="index.html" method="get"><input type="search" name="q" autocomplete="off" aria-label="検索語"><button type="submit">検索</button></form></div></div>
<div class="res" id="res"></div>
<footer><div class="wrap"><span>トータル</span><a class="mark" href="_/index.html" title="※">※</a></div></footer>
<script>var NAME='トータル';
(function(){
var qs=new URLSearchParams(location.search),q=(qs.get('q')||'').trim();
var inputs=document.querySelectorAll('input[name=q]');
inputs.forEach(function(i){i.value=q});
if(!q){inputs[0].focus();return}
document.body.classList.add('has-q');document.title=q+' ― '+NAME;
function norm(s){return (s||'').normalize('NFKC').toLowerCase()}
var words=norm(q).split(/[\s　]+/).filter(Boolean);
fetch('search.json').then(function(r){return r.json()}).then(function(idx){
  var hits=[];
  idx.forEach(function(d){
    var t=norm(d.t),o=norm(d.o),k=norm(d.k),b=norm(d.b),y=norm(d.y),score=0;
    for(var i=0;i<words.length;i++){var w=words[i],s=0;
      if(t.indexOf(w)>=0)s+=30;if(o.indexOf(w)>=0)s+=d.list?40:12;if(k.indexOf(w)>=0)s+=8;if(y.indexOf(w)>=0)s+=4;
      var n=b.split(w).length-1;if(n)s+=Math.min(n,8)*2+1;
      if(!s){score=0;break}score+=s}
    if(score)hits.push([score,d])});
  hits.sort(function(a,b){return b[0]-a[0]});
  var res=document.getElementById('res'),h='';
  if(!hits.length){
    h='<div class="none"><p>「'+esc(q)+'」に該当する資料は公開されていません。</p><p>別の言葉で探すか、<a href="annai.html">資料の案内</a>から機関ごとの一覧をご覧ください。</p></div>';
  }else{
    h='<p class="stat">'+hits.length+' 件</p>';
    hits.forEach(function(x){var d=x[1];
      h+='<div class="hit"><p class="src">'+esc(d.o)+(d.k?'<span>'+esc(d.k)+'</span>':'')+(d.y?'<span>'+esc(d.y)+'</span>':'')+'</p><h3><a href="'+d.u+'">'+mark(d.t)+'</a></h3><p>'+snippet(d.b)+'</p></div>'});
  }
  res.innerHTML=h;
});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mark(s){var e=esc(s);words.forEach(function(w){if(!w)return;var re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');e=e.replace(re,function(m){return '<mark>'+m+'</mark>'})});return e}
function snippet(b){var nb=norm(b),pos=-1;for(var i=0;i<words.length;i++){var p=nb.indexOf(words[i]);if(p>=0&&(pos<0||p<pos))pos=p}
  if(pos<0)return esc(b.slice(0,110))+(b.length>110?'…':'');
  var st=Math.max(0,pos-40),en=Math.min(b.length,pos+100);return (st>0?'…':'')+mark(b.slice(st,en))+(en<b.length?'…':'')}
})();
</script>
</body></html>
